<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Advance Signal Dashboard</title>
    <style>
        :root {
            --bg-color: #1a1512;
            --card-bg: #2a221c;
            --accent-gold: #d4af37;
            --text-light: #f5f0eb;
            --green-buy: #28a745;
            --red-sell: #dc3545;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            direction: rtl;
        }

        .header {
            text-align: center;
            padding: 10px;
            border-bottom: 2px solid var(--accent-gold);
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--accent-gold);
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        select, button {
            background: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #44362b;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: relative;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3d3127;
            padding-bottom: 8px;
        }

        .pair-name {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .price-tag {
            font-size: 16px;
            font-weight: bold;
        }

        .signal-box {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .buy-signal { background: rgba(40, 167, 69, 0.2); color: var(--green-buy); border: 1px solid var(--green-buy); }
        .sell-signal { background: rgba(220, 53, 69, 0.2); color: var(--red-sell); border: 1px solid var(--red-sell); }
        .neutral-signal { background: rgba(212, 175, 55, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }

        .details {
            font-size: 13px;
            line-height: 1.6;
            color: #d1c7bd;
        }

        .details span {
            color: var(--text-light);
            font-weight: bold;
        }

        .time-badge {
            font-size: 11px;
            background: #3d3127;
            padding: 2px 6px;
            border-radius: 3px;
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MT5 Advance Live Signal Board</h1>
        <small>موبائل اور ڈیسک ٹاپ کے لیے ایڈوانس پریڈکشن سسٹم</small>
    </div>

    <div class="controls">
        <label>تخمیناتی وقت (Timeframe): </label>
        <select id="timeframeSelect" onchange="generateSignals()">
            <option value="20m">20 منٹ (Short Scalp)</option>
            <option value="30m" selected>30 منٹ (Intraday)</option>
            <option value="40m">40 منٹ (Intraday)</option>
            <option value="1d">1 دن (Swing Trade)</option>
            <option value="2d">2 دن (Position Trade)</option>
        </select>
        <button onclick="generateSignals()">ریفریش سگنلز</button>
    </div>

    <div class="grid-container" id="dashboardGrid">
        <!-- Live Pairs Cards Will Be Generated Here -->
    </div>

    <script>
        const pairsData = [
            { symbol: "XAUUSD (Gold)", basePrice: 4065.00, volatility: 3.5 },
            { symbol: "BTCUSD (Bitcoin)", basePrice: 75950.00, volatility: 250 },
            { symbol: "XAGUSD (Silver)", basePrice: 51.87, volatility: 0.15 },
            { symbol: "ETHUSD (Ethereum)", basePrice: 2244.85, volatility: 15.0 }
        ];

        function getRandomSignal() {
            const types = ["BUY / LONG", "SELL / SHORT", "WAIT / NEUTRAL"];
            return types[Math.floor(Math.random() * types.length)];
        }

        function generateSignals() {
            const grid = document.getElementById("dashboardGrid");
            const tf = document.getElementById("timeframeSelect").value;
            grid.innerHTML = "";

            pairsData.forEach(pair => {
                const signal = getRandomSignal();
                let signalClass = "neutral-signal";
                if(signal.includes("BUY")) signalClass = "buy-signal";
                if(signal.includes("SELL")) signalClass = "sell-signal";

                const currentPrice = (pair.basePrice + (Math.random() * pair.volatility - pair.volatility/2)).toFixed(2);
                const tp = signal.includes("BUY") ? (parseFloat(currentPrice) + pair.volatility * 1.5).toFixed(2) : (parseFloat(currentPrice) - pair.volatility * 1.5).toFixed(2);
                const sl = signal.includes("BUY") ? (parseFloat(currentPrice) - pair.volatility * 0.8).toFixed(2) : (parseFloat(currentPrice) + pair.volatility * 0.8).toFixed(2);

                const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="pair-name">${pair.symbol}</span>
                            <span class="time-badge">${tf}</span>
                        </div>
                        <div style="margin-top: 8px;">
                            قیمت: <span class="price-tag">${currentPrice}</span>
                        </div>
                        <div class="signal-box ${signalClass}">
                            ${signal}
                        </div>
                        <div class="details">
                            پیشنگوئی وقت: <span>${tf}</span><br>
                            ٹیک پرافٹ (TP): <span>${tp}</span><br>
                            اسٹاپ لاس (SL): <span>${sl}</span><br>
                            تکنیکی انڈیکیٹر: <span>EMA 8/21 + RSI (14)</span>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });
        }

        // Initial Call
        generateSignals();
    </script>
</body>
</html>
